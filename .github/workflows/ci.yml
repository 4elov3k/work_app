# Minimal CI: catch build/lint/test regressions on every PR. Runs on
# pull_request against any branch, plus push to app/master so a direct push
# (or a merge) is checked too. No deploy steps, no matrix, no Postgres
# service — every backend package with tests today is pure unit tests that
# don't touch a live database (see backend/internal/{accounting,docparse,
# saby,export/updxml}/*_test.go). If a future package's tests need a live
# Postgres, add a `services: postgres:` block to the backend job rather than
# assuming this holds forever.
name: CI

on:
  pull_request:
  push:
    branches: [app, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run lint
